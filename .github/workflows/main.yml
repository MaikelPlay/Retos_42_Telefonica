name: Challenge 07 CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        gcc --version
        
    - name: Debug workspace
      run: |
        echo "Current directory:"
        pwd
        echo "Directory contents:"
        ls -la
        echo "Full repository structure:"
        find . -type d
        echo "Files in repository:"
        find . -type f
        
    - name: Navigate and build
      run: |
        echo "Looking for challenge07 directory..."
        find . -name "challenge07" -type d
        if [ -d "Retos_CI-CD-main/challenge07" ]; then
          cd Retos_CI-CD-main/challenge07
        elif [ -d "challenge07" ]; then
          cd challenge07
        else
          echo "ERROR: Could not find challenge07 directory"
          exit 1
        fi
        echo "Challenge07 directory contents:"
        ls -la
        echo "Makefile contents:"
        cat Makefile
        echo "Compiling program..."
        make
        
    - name: Run tests
      run: |
        if [ -d "Retos_CI-CD-main/challenge07" ]; then
          cd Retos_CI-CD-main/challenge07
        elif [ -d "challenge07" ]; then
          cd challenge07
        else
          echo "ERROR: Could not find challenge07 directory"
          exit 1
        fi
        make test

        
    - name: Run tests
      run: |
        cd challenge07
        make test
