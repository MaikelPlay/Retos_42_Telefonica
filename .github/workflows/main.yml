name: Challenge 07 CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        gcc --version
        
    - name: Debug workspace
      run: |
        echo "Current directory:"
        pwd
        echo "Directory contents:"
        ls -la
        echo "Repository structure:"
        find . -type f -name "Makefile" -o -name "*.c"
        
    - name: Navigate and build
      run: |
        cd Retos_CI-CD-main/challenge07
        echo "Challenge07 directory contents:"
        ls -la
        echo "Makefile contents:"
        cat Makefile
        echo "Compiling program..."
        make
        
    - name: Run tests
      run: |
        cd Retos_CI-CD-main/challenge07
        make test
        
    - name: Run tests
      run: |
        cd challenge07
        make test
