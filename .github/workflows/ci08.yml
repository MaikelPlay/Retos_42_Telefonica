name: Challengue 08 C Matrix CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repository and change directory to challenge08
      uses: actions/checkout@v3
      with:
        path: Retos_CI-CD-main/challenge08
        
    - name: Set up GCC (Ubuntu only)
      # Usar 'setup-gcc' solo en Ubuntu
      if: ${{ matrix.os == 'ubuntu-latest' }}
      uses: egor-tensin/setup-gcc@v1
      with:
        platform: x64
        
    - name: Set up MinGW (Windows only)
      # Usar 'setup-mingw' solo en Windows, según el mensaje de error
      if: ${{ matrix.os == 'windows-latest' }}
      uses: egor-tensin/setup-mingw@v1
      with:
        platform: x64
        
    # macOS NO necesita un paso de instalación, ya que usa sus herramientas predeterminadas.

    - name: Debug environment
      run: |
        echo "OS: ${{ matrix.os }}"
        gcc --version
        
    - name: Build
      run: |
        echo "Building on ${{ matrix.os }}..."
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          mingw32-make all
        else
          make all
        fi
      shell: bash
      
    - name: Test program
      run: |
        echo "Testing on ${{ matrix.os }}..."
        ./starter
      shell: bash
